# grace-review — TURNED OFF (owner ruling 2026-11-24, as for the engine on 2026-11-15).
#
# The GPT/Gemini panel no longer runs on PRs in this repo; no model is called. The check
# name "Multi-LLM diff defect review" is still a required status check on main, and a
# required check that never reports blocks every merge, so this one job reports success
# on every PR event without reviewing anything. EPM's Opus review is the review now.
# The old panel and guard are in git history (this file before this commit).
# Note: scripts/grace-publish-gate.sh reads a receipt from the old panel; with the panel
# off it fails closed, so an npm publish needs that gate updated first.
name: grace-review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled, edited, synchronize]

permissions:
  contents: read

jobs:
  review:
    name: Multi-LLM diff defect review
    runs-on: ubuntu-latest
    steps:
      - name: Panel turned off (owner 2026-11-24)
        run: echo "GPT/Gemini review is turned off for this repo (owner 2026-11-24). No model was called."
