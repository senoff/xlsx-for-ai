name: publish

# Publishes xlsx-for-ai to npm. Two trigger modes:
#
#   1. workflow_dispatch — fire from any terminal:
#        gh workflow run publish.yml --ref main -f version_bump=none -f dry_run=false
#      Publishes the version main already carries. It does NOT bump, commit, tag or
#      push: this workflow never mutates main.
#
#   2. push of a v* tag — for "tag, then publish":
#      Just publishes whatever's at the tag; no bump.
#
# THE BUMP IS NOT THIS WORKFLOW'S JOB, AND CANNOT BE (XLS-542, 2026-07-16).
# It used to `npm version` + `git push --follow-tags` straight at main. main is a
# PROTECTED branch, so that push is rejected GH006 — and it ran AFTER `npm publish`,
# which is irreversible. Measured result: 3.2.5 went live on npm while main stayed at
# 3.2.4, the tag survived as an orphan, and the MCP Registry served the API-key-
# destroying 3.2.4 for ~42 hours. The publish succeeded; the record of it never landed.
#
# Protection is not the villain — it is why this surfaced, and it stays. An irreversible
# step must never run before a step that can fail. So the bump lands on main FIRST, as a
# reviewed PR through the door, and this workflow publishes what main already carries:
#
#   1. PR the version bump -> land it (main now carries the new version)
#   2. dispatch this workflow with version_bump=none
#
# AUTH IS OIDC TRUSTED PUBLISHING — NO NPM TOKEN, EVER (XLS-959, 2026-08-17). Bob:
# "v4.0.0 ships AS the first trusted publish; no more npm tokens ever." `npm publish`
# authenticates to the registry with the workflow's short-lived GitHub OIDC identity
# (permissions.id-token: write, below) — there is no NODE_AUTH_TOKEN and no XLSX_NPM
# secret. Provenance is generated automatically under trusted publishing, so the
# supply-chain attestation the old `--provenance` flag bought is now inherent.
#
# Setup prereqs (one-time, needs the package owner — done in the npm UI, not here):
#   - npm: package → Settings → Trusted Publishers → add this repo + workflow
#          (senoff/xlsx-for-ai, .github/workflows/publish.yml). That, plus id-token:
#          write below, IS the entire auth path — no account-mode / MFA / token dance.
#   - Trusted publishing requires npm >= 11.5.1 (asserted at runtime, below).
#
# The ONLY secret this workflow references is XFA_SMOKE_KEY (the post-publish smoke's
# read-scoped credential). No publish secret exists to leak, rotate, or expire.

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "MUST be 'none'. Bumping here cannot work: the push to protected main is rejected GH006, and it would run AFTER the irreversible npm publish. Bump via PR first, then dispatch this."
        required: true
        type: choice
        default: none
        options:
          - none
      version:
        description: "The version you intend to publish — MUST equal package.json's version (fat-finger guard, XLS-959). A mismatch refuses before anything irreversible. e.g. 4.0.0"
        required: true
        type: string
      dry_run:
        description: "Run npm pack + clean-install verification but skip the actual publish."
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Least privilege (XLS-959): the workflow default is READ-ONLY. `id-token: write` — the
# OIDC token-minting that authenticates the npm publish — is granted ONLY on the publish
# job below, NOT at workflow scope, so the post-publish smoke matrix never inherits
# token-minting it has no need for (a compromised smoke step cannot mint a registry token).
permissions:
  contents: read    # this workflow no longer commits or pushes anything. It reads main
                    # and publishes what main carries; the bump arrives as a reviewed PR.
  actions: read         # XLS-615: read the grace receipt artifact (gh api actions/artifacts)
  pull-requests: read   # XLS-615: map the release commit on main to its PR head sha

jobs:
  publish:
    runs-on: ubuntu-latest
    # Hard ceiling: this job performs the irreversible npm publish + registry sync; a hung
    # network step must not pin a runner to the default 6h timeout (XLS-959/grace).
    timeout-minutes: 30
    # id-token: write lives HERE — the ONLY job that mints an OIDC token (npm trusted
    # publishing + automatic provenance). Job-level permissions replace the workflow
    # default entirely, so the read grants the grace gate needs are restated.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      # FIRST, and before anything irreversible. The rule this enforces is the one the
      # old order broke: a step that CAN fail must never run after a step that CANNOT be
      # undone. `npm publish` cannot be undone; a push to protected main always fails.
      # THE PROPERTY THIS WHOLE FILE CLAIMS, NOW ENFORCED INSTEAD OF ASSERTED.
      # The header says "publishes what main already carries". Nothing checked it: a
      # `workflow_dispatch --ref <any-branch-or-sha>` published THAT ref. npm publish is
      # irreversible, so an accidental dispatch from a feature branch ships code that never
      # landed — the exact class this PR exists to remove, left live in the fix for it.
      # Tag events are exempt by design: they publish the tagged commit, and the tag/version
      # agreement is enforced below.
      - name: Enforce main-only for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publish.yml must be dispatched against main (got: $GITHUB_REF)."
            echo "This workflow publishes what main carries. Publishing another ref would ship"
            echo "code that never landed — and npm publish cannot be undone."
            echo "  gh workflow run publish.yml --ref main -f version_bump=none -f dry_run=false"
            exit 1
          fi
          echo "Dispatch ref is main."

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the release-commit pin guard below runs `git log -1 -- package.json`
          # to find the commit that last set the version, and needs history to walk to it.
          # (I first removed this citing provenance — an invented reason I never measured.
          # The real consumer is the pin guard; this is a measured need.) The `token:` is gone
          # with the push it served.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing (no token) requires npm >= 11.5.1 (XLS-959) — older npm has
      # no OIDC codepath and would demand a token that no longer exists. setup-node's bundled
      # npm can be below that, so upgrade in place if needed, then ASSERT and fail closed. Runs
      # before install/pack/publish, so a too-old runner dies here, not at the irreversible step.
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          FLOOR="11.5.1"
          CUR="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$FLOOR" "$CUR" | sort -V | head -n1)" != "$FLOOR" ]; then
            echo "npm $CUR is below $FLOOR — upgrading for trusted publishing."
            npm install -g "npm@>=${FLOOR}"
          fi
          CUR="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$FLOOR" "$CUR" | sort -V | head -n1)" != "$FLOOR" ]; then
            echo "::error::npm $CUR is below the ${FLOOR} floor required for OIDC trusted publishing."
            exit 1
          fi
          echo "npm $CUR supports OIDC trusted publishing."

      # BOTH validations run here — after node, BEFORE install/test/pack. A doomed run dies
      # in seconds, not after a full install, and always before anything irreversible.

      # DISPATCH pin (the moving-HEAD hole). "Publish what main carries" is only honest if
      # main's tip IS the release commit. If code lands on main after the bump PR merges, a
      # dispatch would ship those commits under the already-bumped version, un-announced —
      # and npm publish cannot be undone. So refuse unless HEAD is the commit that last set
      # the version. Drift -> tag the intended commit and publish via the tag path instead.
      - name: Pin dispatch to the release commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          LAST_VER_COMMIT="$(git log -1 --format=%H -- package.json)"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$LAST_VER_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::main has moved past the release commit."
            echo "HEAD is ${HEAD_COMMIT}, but the last commit to touch package.json is"
            echo "${LAST_VER_COMMIT}. Publishing now would ship commits that landed after the"
            echo "version was set, under that version. Tag ${LAST_VER_COMMIT} and publish via"
            echo "the v* tag path, or land the intended tree as its own versioned release."
            exit 1
          fi
          echo "HEAD is the release commit ${HEAD_COMMIT}."

      # TAG validation: a v* tag publishes the tagged commit; assert the tag NAME matches the
      # version in package.json AT that commit. A mistyped tag (v3.2.6 on a 3.2.5 tree) would
      # ship 3.2.5 under a v3.2.6 tag, or collide with a published version and fail confusingly
      # at the irreversible step.
      - name: Validate tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}."
            echo "The tag names one version and the tree carries another; publishing would ship"
            echo "${PKG_VERSION} under a v${TAG_VERSION} tag. Retag the correct commit."
            exit 1
          fi
          echo "Tag v${TAG_VERSION} matches package.json ${PKG_VERSION}."

      # server.json ↔ package.json agreement (XLS-504). A static tree check, so it runs HERE with
      # the other pre-publish validations — BEFORE Install/Pack/publish, before anything
      # irreversible. The MCP Registry sync (far below) reads server.json; if it disagrees with
      # package.json the bump PR was half-done, and catching it after `npm publish` would leave
      # npm shipped while the registry refuses = the exact drift this card removes. So fail here,
      # closed, first. Runs on every trigger incl. dry_run — a mismatched tree is not releasable.
      - name: Verify server.json version matches package.json
        run: |
          PKG_V="$(node -p "require('./package.json').version")"
          SRV_V="$(node -p "require('./server.json').version")"
          SRV_PKG_V="$(node -p "require('./server.json').packages[0].version")"
          if [ "$SRV_V" != "$PKG_V" ] || [ "$SRV_PKG_V" != "$PKG_V" ]; then
            echo "::error::server.json (version=$SRV_V, packages[0]=$SRV_PKG_V) != package.json ($PKG_V)."
            echo "Bump server.json in the same PR as package.json. The in-runner sync that used to"
            echo "hide this was removed (XLS-504) because its result never landed on main."
            exit 1
          fi
          echo "server.json matches package.json at $PKG_V."

      # FAT-FINGER GUARD (XLS-959). On manual dispatch the operator NAMES the version they
      # intend to ship; refuse unless package.json already carries exactly that. It layers on
      # top of the release-commit pin: the pin proves HEAD is the commit that set the version,
      # this proves the operator MEANT that version. Static tree check, before anything
      # irreversible; runs on dry_run too (a mismatched intent is not releasable). To PROVE the
      # refusal: dispatch with a version that disagrees with package.json — it dies here.
      - name: Verify package.json matches the requested version (fat-finger guard)
        if: github.event_name == 'workflow_dispatch'
        run: |
          REQUESTED="${{ inputs.version }}"
          PKG_V="$(node -p "require('./package.json').version")"
          if [ "$REQUESTED" != "$PKG_V" ]; then
            echo "::error::Requested version ${REQUESTED} does not match package.json version ${PKG_V}."
            echo "Dispatch names the version you intend to publish; the tree carries another."
            echo "Bump package.json (and server.json) to ${REQUESTED} via a reviewed PR first, or"
            echo "dispatch with version=${PKG_V} if ${PKG_V} is what you mean to ship."
            exit 1
          fi
          echo "Requested version ${REQUESTED} matches package.json."

      # ENFORCEMENT HALF of the grace gate (XLS-615). XLS-412 made a kept CRITICAL
      # VISIBLE on the PR (the gate is ADVISORY — not a required check, so a CRITICAL
      # can land, and a human PR-body override can wave one through at merge). It does
      # NOT stop a publish: this workflow published "what main carries" and read the
      # verdict NOWHERE. So a kept CRITICAL would ship to npm, and `npm publish` cannot
      # be undone. This step reads the grace verdict from the RECEIPT ARTIFACT's machine
      # field (override-receipt.json .severity, refute-aware /2 — NOT a prose grep) and
      # REFUSES on a kept CRITICAL, here, before Install/Pack/publish — an irreversible
      # step must never run after a step that can fail. Fails closed on a missing/expired/
      # UNKNOWN receipt (an unrun gate is not a pass). See scripts/grace-publish-gate.sh.
      - name: Refuse to publish on a kept CRITICAL (grace verdict)
        run: bash scripts/grace-publish-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install
        run: npm ci

      - name: Test
        run: npm test --if-present

      # XLS-849 — refuse to publish a baked tool floor that has drifted from live
      # inventory (the 50-vs-full staleness class). Real drift (exit 1) blocks the
      # release; an unreachable inventory (exit 2) is infra, not drift — warn and
      # proceed rather than couple every publish to prod reachability.
      - name: Verify baked tool floor is fresh vs live inventory
        run: |
          set +e
          npm run tool-floor:check
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "tool floor is fresh."
          elif [ "$code" -eq 2 ]; then
            echo "::warning::could not reach live inventory to verify the tool floor — proceeding (infra, not drift)."
          else
            echo "::error::baked tool floor has drifted from live inventory — regenerate with 'npm run tool-floor:generate' and commit before publishing."
            exit 1
          fi

      - name: Read package metadata
        id: pkg
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$VERSION"

      # Normalize dry_run to an unambiguous string output. workflow_dispatch
      # boolean inputs are reported inconsistently across the inputs vs
      # github.event.inputs contexts (string vs real boolean, runner-dependent),
      # so a literal `inputs.dry_run == false` / `== 'false'` compare in an `if:`
      # is fragile either way. Inside a shell step both a boolean and a string
      # render identically, so resolve here once and gate on this output.
      - name: Resolve dry-run flag
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against republishing existing version
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version 2>/dev/null; then
            echo "::notice::Version ${{ steps.pkg.outputs.version }} is already published — skipping pack/install/publish steps."
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          else
            echo "Version ${{ steps.pkg.outputs.version }} not yet published — proceeding."
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

      - name: Pack
        if: env.ALREADY_PUBLISHED != 'true'
        run: npm pack

      - name: Clean-install verification (per feedback_pre_publish_clean_install.md)
        if: env.ALREADY_PUBLISHED != 'true'
        run: |
          set -e
          TARBALL=$(ls ${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.tgz)
          mkdir -p /tmp/clean-install-test
          cd /tmp/clean-install-test
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          npx --no-install xlsx-for-ai --version
          echo "Clean install verified: tarball installs and CLI runs."

      # OIDC TRUSTED PUBLISHING — no token (XLS-959). npm authenticates with the workflow's
      # OIDC identity (permissions.id-token: write); provenance is generated automatically, so
      # the old `--provenance` flag and the NODE_AUTH_TOKEN/XLSX_NPM secret are both GONE. This
      # is the only irreversible step; every validation above runs before it. `published=true`
      # is emitted only when a real publish actually ran, gating the post-publish smoke job.
      - name: Publish to npm (OIDC trusted publishing)
        id: publish
        if: env.ALREADY_PUBLISHED != 'true' && steps.flags.outputs.dry_run == 'false'
        run: |
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"
          # Durable audit record of this irreversible, security-relevant operation to the immutable
          # run summary — recoverable from the run record for compliance / incident response, alongside
          # the MCP-sync audit line below (XLS-959/grace). Provenance itself is attested on npm.
          echo "- **npm publish (OIDC trusted publishing):** \`${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}\` published with automatic provenance at $(date -u +%Y-%m-%dT%H:%M:%SZ) (run \`${GITHUB_RUN_ID}\`)." >> "$GITHUB_STEP_SUMMARY"

      # ── MCP Registry sync — the AUTHORITATIVE per-release path (XLS-504) ─────────────────
      # publish.yml owns keeping the Official MCP Registry (io.github.senoff/xlsx-for-ai) in
      # sync on every release. publish-mcp.yml's automatic v* tag trigger is RETIRED (XLS-504):
      # releases are tagless workflow_dispatches, so that trigger never fired for 3.2.6–3.2.9
      # and the registry silently stranded behind npm. One release path, one sync, gated LOUD —
      # no tag-discipline dependency, no continue-on-error swallowing the failure.
      #
      # server.json is NO LONGER mutated in-runner. Its version is committed to main in the SAME
      # reviewed bump PR as package.json (XLS-504 removes the ephemeral in-runner write whose
      # result never landed — that is exactly why main's server.json sat at 3.2.1 for 8 releases
      # while npm moved to 3.2.9). The two are verified to AGREE up front, in the pre-publish
      # validation block above ("Verify server.json version matches package.json") — before
      # anything irreversible — so a half-done bump PR fails the release without publishing.

      # KILL the npm-propagation 404. The MCP Registry validates that the npm version named in
      # server.json actually EXISTS on npm; submit too soon after `npm publish` and the registry
      # 404s the version and the sync fails. Poll npm (bounded) until this exact version is
      # visible, so the registry submit only runs against a version npm will confirm.
      - name: Wait for npm to propagate this version
        if: steps.flags.outputs.dry_run == 'false'
        run: |
          set -eu
          V="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          for attempt in $(seq 1 10); do
            # Per-call timeout: a stalled npm CLI/registry must not hang the runner (the loop's
            # own bound is meaningless if one iteration blocks forever).
            if timeout 30s npm view "${NAME}@${V}" version >/dev/null 2>&1; then
              echo "npm is serving ${NAME}@${V} (attempt ${attempt})."
              exit 0
            fi
            echo "npm not yet serving ${NAME}@${V} (attempt ${attempt}/10); waiting..."
            if [ "$attempt" -lt 6 ]; then sleep $((attempt * 3)); else sleep 18; fi
          done
          echo "::error::npm never surfaced ${NAME}@${V} within the propagation window — the MCP"
          echo "Registry would 404 this version. Not submitting against a version npm cannot confirm."
          exit 1

      # Submit server.json to the MCP Registry — GATED LOUD (no continue-on-error, XLS-504). A
      # failed sync now FAILS THE RELEASE JOB, making the drift visible and actionable instead of
      # the old silent skip that let the registry rot behind npm for ~8 releases. Idempotent: if
      # the registry already serves this exact version (a re-dispatch of a done release, keyed on
      # isLatest — never list position), it is a no-op success, not a duplicate-publish failure.
      - name: Publish to MCP Registry (OIDC)
        if: steps.flags.outputs.dry_run == 'false'
        env:
          # Pinned to a released tag + SRI hash so a republished or tampered binary fails closed
          # — the same integrity-pinning contract the lockfile/signed-install gates apply to the
          # dep tree, extended to the publish-path binary fetch. Bump both together.
          MCP_PUBLISHER_TAG: v1.7.9
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          MCP_NAME="io.github.senoff/xlsx-for-ai"
          # Record the registry-sync outcome to the immutable run summary — a durable audit entry
          # for this security-relevant operation (OIDC publish to the MCP Registry), so a synced /
          # no-op / stranded result is recoverable from the run record, not only the scrolling log.
          audit() { echo "- **MCP Registry sync:** $1" >> "$GITHUB_STEP_SUMMARY"; }
          # Resolve the registry's isLatest npm version with node (guaranteed present — setup-node
          # ran; no jq dependency). Keys on the isLatest FIELD, never list position; exactly-one
          # isLatest and exactly-one matching npm package, else empty (an ambiguous answer is not a
          # version). Empty on any error too — a failed probe must not masquerade as "already synced".
          reg_latest() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 \
              "https://registry.modelcontextprotocol.io/v0/servers?search=${MCP_NAME}&version=latest" 2>/dev/null \
              | node -e '
                  let s = "";
                  process.stdin.on("data", (d) => (s += d)).on("end", () => {
                    try {
                      const n = "io.github.senoff/xlsx-for-ai";
                      const servers = (JSON.parse(s).servers) || [];
                      const mine = servers.filter((x) => x && x.server && x.server.name === n);
                      const latest = mine.filter((x) => ((x._meta || {})["io.modelcontextprotocol.registry/official"] || {}).isLatest === true);
                      if (latest.length !== 1) return process.stdout.write("");
                      const pk = (latest[0].server.packages || []).filter((p) => p.registryType === "npm" && p.identifier === "xlsx-for-ai");
                      process.stdout.write(pk.length === 1 ? String(pk[0].version) : "");
                    } catch { process.stdout.write(""); }
                  });' 2>/dev/null || true
          }
          CUR="$(reg_latest)"
          if [ "$CUR" = "$V" ]; then
            echo "MCP Registry already serves isLatest=${V} — nothing to sync (idempotent no-op)."
            audit "already at \`${V}\` (no-op)"
            exit 0
          fi
          echo "MCP Registry isLatest is '${CUR:-<unmeasured>}', package is ${V} — syncing."
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_TAG}/mcp-publisher_linux_amd64.tar.gz"
          echo "Verifying mcp-publisher ${MCP_PUBLISHER_TAG} against pinned SHA-256..."
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          published=false
          for attempt in 1 2 3; do
            if timeout 60s ./mcp-publisher login github-oidc && timeout 60s ./mcp-publisher publish; then
              published=true
              echo "mcp-publisher publish succeeded (attempt $attempt)."
              break
            fi
            echo "mcp-publisher attempt $attempt failed." >&2
            [ "$attempt" -lt 3 ] && sleep $((attempt * 2))
          done
          if [ "$published" != true ]; then
            echo "::error::mcp-publisher failed after 3 attempts — the MCP Registry is now STRANDED"
            echo "behind npm (npm=${V}, registry=${CUR:-unknown}). Failing the release LOUD (XLS-504):"
            echo "fix and re-run; do not leave the registry drifted behind npm."
            audit "**FAILED** — stranded behind npm (npm=\`${V}\`, registry=\`${CUR:-unknown}\`)"
            exit 1
          fi
          audit "synced \`${CUR:-<unmeasured>}\` → \`${V}\`"

      - name: Summary
        if: always()
        run: |
          echo "## Publish summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- **Bump:** ${{ inputs.version_bump }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Dry run:** ${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          fi

  # POST-PUBLISH SMOKE (XLS-959). Automatic on every real publish — the published npm artifact
  # is installed FROM THE REGISTRY (not this repo) on Windows + macOS and exercised in both the
  # modes users run it: CLI, and MCP over stdio (initialize + tools/list + a real xlsx_read).
  # It runs AFTER publish and cannot un-publish — a failure here is an ALERT that the shipped
  # artifact is broken on a platform, surfaced LOUD on the run instead of found by a user. Gated
  # on published==true, so dry-runs and already-published re-dispatches skip it. Mirrors the
  # proven win-smoke invocation (XLS-958): config key is `api_key`, and the MCP handshake needs
  # notifications/initialized before tools/list. XFA_SMOKE_KEY is the sole secret in this file.
  post_publish_smoke:
    name: Post-publish smoke (registry install)
    needs: publish
    if: needs.publish.outputs.published == 'true'
    # Read-only — installs from the public registry, mints nothing. NO id-token (least
    # privilege): the smoke has no reason to hold the OIDC token the publish job uses.
    permissions:
      contents: read
    # Hard ceiling so a wedged MCP handshake cannot burn a runner to the default 6h timeout.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout is read-only (contents: read, no persisted creds) and exists ONLY so
      # this job can run the single-sourced smoke harness (scripts/mcp_smoke.py) — the
      # very code the harness self-test mutation-proves (XLS-988). No repo code is
      # executed against the published artifact beyond that harness.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the EXACT version just published. Registry propagation is per-edge, so retry a
      # bounded window before failing — the smoke must test the real published artifact, not 404.
      - name: Clean install just-published version from the registry
        shell: bash
        run: |
          set -euo pipefail
          PKG="${{ needs.publish.outputs.name }}@${{ needs.publish.outputs.version }}"
          # Poll npm until this exact version is visible on THIS runner's edge (propagation is
          # per-region), THEN install once — clearer than a blind retry-install loop, and uses a
          # bash `until` counter (no `seq`, portable across the macOS/Windows runners). XLS-959/grace.
          attempt=1
          until npm view "$PKG" version >/dev/null 2>&1; do
            if [ "$attempt" -ge 10 ]; then
              echo "::error::registry never served $PKG within the propagation window."
              exit 1
            fi
            echo "registry not yet serving $PKG (attempt $attempt/10); waiting..."
            attempt=$((attempt + 1))
            sleep 12
          done
          mkdir smoke && cd smoke
          npm init -y >/dev/null
          npm install "$PKG"
          echo "Installed $PKG."

      - name: Inject smoke credentials (read-scoped; the ONLY secret this workflow references)
        shell: bash
        env:
          XFA_SMOKE_KEY: ${{ secrets.XFA_SMOKE_KEY }}
        run: |
          set -eu
          if [ -z "${XFA_SMOKE_KEY:-}" ]; then
            echo "::error::XFA_SMOKE_KEY is not set — cannot run the post-publish smoke."
            exit 1
          fi
          mkdir -p "$HOME/.xlsx-for-ai"
          # Serialize via json.dumps so a key with quotes/backslashes/newlines can't corrupt
          # the config into a false-negative smoke failure (XLS-959, grace). setup-python ran.
          python -c "import json,os; p=os.path.join(os.path.expanduser('~'),'.xlsx-for-ai','config.json'); open(p,'w').write(json.dumps({'api_key': os.environ['XFA_SMOKE_KEY']}))"

      - name: Make fixture
        shell: bash
        run: |
          python -m pip install openpyxl
          python -c "
          from openpyxl import Workbook
          wb = Workbook(); ws = wb.active; ws.title = 'Data'
          for r in [[10],[0],[30],[0],[50]]: ws.append(r)
          wb.save('smoke/t.xlsx')"

      - name: CLI mode
        shell: bash
        run: |
          cd smoke
          # npx resolves the LOCAL install cross-platform (no POSIX-path .bin shim assumption
          # that breaks under bash on windows-latest, XLS-959/grace). --no-install: never re-fetch.
          npx --no-install xlsx-for-ai t.xlsx

      - name: MCP stdio mode
        shell: bash
        run: |
          cd smoke
          # Single-sourced harness (scripts/mcp_smoke.py): initialize + tools/list +
          # xlsx_read must all answer. It closes stdin once (EOF-driven shutdown) and
          # drains both pipes via communicate() so a >64KB tools/list response is never
          # truncated by a premature terminate — the XLS-988 false-RED. The identical
          # code is mutation-proved by .github/workflows/smoke-selftest.yml.
          #
          # Pass the .bin shim path with OS-NATIVE separators (XLS-1553). The harness
          # spawns the shim directly: POSIX runs the bare path (shell=False); Windows
          # appends ".cmd" and runs it via cmd.exe (shell=True). cmd.exe treats "/" as a
          # switch delimiter, so a forward-slash path (node_modules/.bin/...) is parsed as
          # the command "node_modules" and dies "'node_modules' is not recognized" — the
          # windows-latest RED that blocked publish. os.path.join yields backslashes on
          # Windows and "/" on POSIX (identical to the string macOS already ran), mirroring
          # the cross-platform resolution the npx CLI step above relies on.
          #
          # This exact invocation is mirrored by .github/workflows/publish-smoke-verify.yml,
          # which proves it on windows-latest PRE-merge (this step only runs post-publish).
          # Keep the two in lockstep if either changes.
          MCP_BIN="$(python -c "import os; print(os.path.join('node_modules', '.bin', 'xlsx-for-ai-mcp'))")"
          python "$GITHUB_WORKSPACE/scripts/mcp_smoke.py" "$MCP_BIN" "t.xlsx"
