name: Publish to MCP Registry

# MANUAL RECOVERY / RECONCILE lever — NOT the per-release path (XLS-504).
#
# The authoritative per-release MCP Registry sync now lives in publish.yml, gated LOUD on
# every release. This workflow's automatic `push: tags: v*` trigger is RETIRED: releases are
# tagless `workflow_dispatch`es (version_bump=none), so v* tags stopped at v3.2.5 while npm
# went to 3.2.9 — the tag trigger never fired for 3.2.6–3.2.9 and the registry silently
# stranded 8 releases behind npm. A trigger that depends on tag discipline the release path
# doesn't keep is not an auto-sync; it's a false sense of one. Keeping it live alongside
# publish.yml's sync would just re-create two paths that disagree.
#
# What remains is a DISPATCH-ONLY tool: reconcile the registry out-of-band (e.g. after a sync
# failed and publish.yml's release already went red) WITHOUT cutting a whole new npm release.
# It reads server.json@main (authoritative — bumped in the same PR as package.json) and submits
# it. Auth: GitHub OIDC (no PAT, no device flow); the registry verifies the OIDC repo claim
# matches server.json's `name` ("io.github.senoff/…"). Publishes ONLY the server.json metadata.

on:
  workflow_dispatch: {}

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read

jobs:
  publish:
    name: mcp-publisher publish
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a hung OIDC login / registry submit must not pin a runner for hours
    steps:
      # This tool's contract is "submit server.json@main". checkout defaults to the dispatched
      # ref, so without this a dispatch from a feature branch would submit THAT branch's
      # server.json to the live registry. Enforce main FIRST, before checkout reads the tree.
      - name: Enforce main-only dispatch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publish-mcp.yml must be dispatched against main (got: $GITHUB_REF)."
            echo "This tool submits server.json@main to the live registry. Reconcile from main,"
            echo "not another ref — otherwise it would sync a tree that never landed."
            exit 1
          fi
          echo "Dispatch ref is main."

      - name: Checkout
        uses: actions/checkout@v4

      # This workflow reads versions with `node -p` (the verify + submit steps). Pin the runtime
      # rather than lean on the runner image's ambient node — same node 22 publish.yml pins.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install mcp-publisher
        # Pinned to a specific upstream release + sha256. Without the pin a
        # maintainer takeover or release-artifact substitution upstream could
        # ship a trojaned binary into this runner, which holds an `id-token:
        # write` OIDC token scoped to the `io.github.senoff/xlsx-for-ai` MCP
        # Registry name. To bump: pick the new upstream release tag and copy
        # the `mcp-publisher_linux_amd64.tar.gz` checksum from that release's
        # `registry_<ver>_checksums.txt`. The version + sha256 pair below
        # assumes the linux_amd64 asset; if you change runs-on to a different
        # OS or arch, swap in the matching asset and its checksum.
        env:
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
            echo "This step is pinned to linux_amd64; current runner is $(uname -s)/$(uname -m)." >&2
            echo "Update MCP_PUBLISHER_SHA256 to the matching asset checksum before changing runs-on." >&2
            exit 1
          fi
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fL --retry 3 --retry-delay 2 --max-time 120 \
            -o "$TMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$TMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar xz -f "$TMP/mcp-publisher.tar.gz" -C "$TMP"
          BIN="$(find "$TMP" -type f -name mcp-publisher -print -quit)"
          if [ -z "$BIN" ]; then
            echo "mcp-publisher binary not found in tarball" >&2
            exit 1
          fi
          mv "$BIN" ./mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher --help | head -5

      # Submit server.json@main AS COMMITTED — it is authoritative (bumped in the same reviewed
      # PR as package.json; publish.yml's release path verifies they agree). XLS-504 removed the
      # old in-runner `jq` mutation that rewrote server.json from package.json: an ephemeral write
      # whose result never landed was the whole reason main's server.json rotted at 3.2.1. Here we
      # only VERIFY the tree we're about to submit is coherent, and refuse if it isn't — a mismatch
      # means main is half-bumped and the fix is a PR, not a runner-local rewrite.
      - name: Verify server.json matches package.json
        run: |
          # set -e so a node failure aborts the step; the empty-guard so a node that returns
          # "" (or absent 'undefined') can't make all three compare equal and pass the check
          # OPEN — an unmeasured version is not a matching one.
          set -euo pipefail
          PKG_V="$(node -p "require('./package.json').version")"
          SRV_V="$(node -p "require('./server.json').version")"
          SRV_PKG_V="$(node -p "require('./server.json').packages[0].version")"
          echo "package.json=${PKG_V}  server.json=${SRV_V}  server.json.packages[0]=${SRV_PKG_V}"
          for pair in "package.json:${PKG_V}" "server.json:${SRV_V}" "server.json.packages[0]:${SRV_PKG_V}"; do
            val="${pair#*:}"
            if [ -z "$val" ] || [ "$val" = "undefined" ]; then
              echo "::error::could not read a version from ${pair%%:*} (got '${val}') — refusing to submit an unverified tree."
              exit 1
            fi
          done
          if [ "$SRV_V" != "$PKG_V" ] || [ "$SRV_PKG_V" != "$PKG_V" ]; then
            echo "::error::server.json (version=$SRV_V, packages[0]=$SRV_PKG_V) != package.json ($PKG_V) on this ref."
            echo "Bump server.json in the same PR as package.json, then reconcile. This tool submits"
            echo "server.json@main as committed; it will not paper over a half-bumped tree (XLS-504)."
            exit 1
          fi
          echo "Submitting server.json at ${PKG_V}."

      # OIDC login + submit, guarded: per-call timeout so a hung login/publish can't stall the
      # runner, bounded retries for a transient registry hiccup, and fail LOUD if all attempts
      # fail (this is a reconcile tool — a silent failure would leave the drift it exists to fix).
      # The outcome is recorded to the immutable run summary as an audit entry for this
      # security-relevant operation (OIDC-authenticated publish to the live registry).
      - name: Authenticate and submit to MCP Registry (OIDC)
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          published=false
          for attempt in 1 2 3; do
            if timeout 60s ./mcp-publisher login github-oidc && timeout 60s ./mcp-publisher publish; then
              published=true
              echo "mcp-publisher publish succeeded (attempt $attempt)."
              break
            fi
            echo "mcp-publisher attempt $attempt failed." >&2
            [ "$attempt" -lt 3 ] && sleep $((attempt * 2))
          done
          if [ "$published" != true ]; then
            echo "::error::mcp-publisher failed after 3 attempts — the registry was NOT reconciled to ${V}."
            echo "- **MCP Registry reconcile:** **FAILED** at \`${V}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- **MCP Registry reconcile:** submitted \`${V}\`" >> "$GITHUB_STEP_SUMMARY"
