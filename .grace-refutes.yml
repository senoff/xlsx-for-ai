  # ---------------------------------------------------------------------------------
  # XLS-988 REFUTE (panel FP) — MCP stdio smoke step KEEPS shell:bash + cd smoke.
  # gpt-5 flagged publish.yml:560 CRITICAL as "dropped shell:bash and cd smoke -> runs
  # in PowerShell at repo root on windows-latest, wrong paths." Both are PRESENT: the
  # step sets `shell: bash` (Git Bash on windows-latest) and its run body `cd smoke`
  # before invoking the harness by ABSOLUTE $GITHUB_WORKSPACE path, so the relative
  # node_modules/.bin + fixture resolve from smoke/. gemini rated it NONE. The run arm
  # emulates the step: with `cd smoke` the relative bin+fixture resolve; the must_fail
  # arm drops the cd (the alleged repo-root regression) and the relative paths then do
  # NOT resolve. Verified FP (xlsx2, XLS-988).
  - claim: "The MCP stdio smoke step sets shell: bash and its run body cd smoke before invoking scripts/mcp_smoke.py by absolute $GITHUB_WORKSPACE path, so on every matrix OS (incl. windows-latest via Git Bash) it runs from smoke/ and the relative node_modules/.bin/xlsx-for-ai-mcp + t.xlsx resolve -- the step was NOT reduced to PowerShell at repo root."
