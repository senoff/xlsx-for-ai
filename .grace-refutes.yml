  # ---------------------------------------------------------------------------------
  # XLS-988 REFUTE (panel FP) — communicate() closes stdin once, delivering EOF.
  # gpt-5 flagged mcp_smoke.py:74 HIGH as "writes p.stdin but never closes it;
  # communicate() with input=None does not close stdin -> servers waiting for EOF hang."
  # FALSE: CPython Popen._communicate closes stdin whenever input is falsy, so
  # communicate(timeout=...) delivers the EOF that drives graceful shutdown; kill()
  # fires only on TimeoutExpired. gemini rated it NONE. The run arm spawns a child that
  # blocks on stdin.read() to EOF then prints GOT_EOF, and drives it with the EXACT
  # harness call (communicate, no input) -> child gets EOF, prints, exits 0. The
  # must_fail arm is the panel's alleged shape (write then never close stdin) -> child
  # blocks on stdin.read() and is still alive when the parent gives up. Verified FP.
  - claim: "run() drains via subprocess communicate() with no input, which closes the child's stdin exactly once (CPython Popen._communicate closes stdin whenever input is falsy), delivering the EOF that drives graceful shutdown; kill() fires only on TimeoutExpired -- stdin is not left open."
